<script src="games.config.js"></script>
<script>
  const games = window.JUDD_GAMES || [];

  const hand = (kind, cards) =>
    `<div class="hand ${kind}">${
      cards.map(card =>
        `<div class="card">
          ${card[0]}
          <span>${card[1]}</span>
          ${card[2] ? `<em>${card[2]}</em>` : ""}
        </div>`
      ).join("")
    }</div>`;

  const art = {
    crowns: hand("five", [
      ["7", "★"],
      ["Q", "♥"],
      ["10", "♣"],
      ["K", "♠"],
      ["J", "♦"]
    ]),

    rook: hand("rook", [
      ["R", "◆", "ROOK"],
      ["Y", "◆", "ROOK"],
      ["G", "◆", "ROOK"],
      ["B", "◆", "ROOK"]
    ])
  };

  const gamesEl = document.getElementById("games");

  games
    .filter(game => game.enabled)
    .forEach(game => {
      const button = document.createElement("button");
      button.className = "game";

      button.innerHTML = `
        <div class="game-art">${art[game.icon] || ""}</div>
        <div class="game-copy">
          <h3>${game.title}</h3>
          <p>${game.subtitle}</p>
        </div>
        <span class="play">▶</span>
      `;

      button.onclick = () => openGame(game);
      gamesEl.append(button);
    });

  function openGame(game) {
    const joiner = game.path.includes("?") ? "&" : "?";

    window.location.assign(
      `${game.path}${joiner}gameNight=${encodeURIComponent(location.href)}`
    );
  }
</script>

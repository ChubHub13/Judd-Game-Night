<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Judd Game Night</title><style>
body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 0,#4c1e5f,transparent 35rem),#100814;color:#fff0c8;font-family:Inter,Arial,sans-serif}.top{display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;border-bottom:1px solid #73535d;background:#100814dd}.brand{display:flex;align-items:center;gap:12px}.mark{display:grid;place-items:center;width:46px;height:46px;border:1px solid #f3c55a66;border-radius:14px;color:#f3c55a;font:30px Georgia}h1{margin:0;color:#ffe29a;font:30px Georgia}.v{font:10px Arial;color:#cdb8ce}.sub{margin:5px 0 0;color:#cdb8ce;font-size:11px;text-transform:uppercase;letter-spacing:.08em}main{max-width:1000px;margin:auto;padding:55px 5vw}.intro h2{margin:0;color:#ffe29a;font:48px Georgia}.intro p{color:#cdb8ce}.box{margin-top:28px;padding:18px;border:1px solid #f3c55a55;border-radius:18px;background:#1e0d24e8}.label{color:#f3c55a;font-size:11px;font-weight:bold;letter-spacing:.12em;text-transform:uppercase}.games{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:13px}.game{position:relative;min-height:255px;overflow:hidden;border:1px solid #ffffff26;border-radius:15px;background:linear-gradient(145deg,#562266,#230e2b);color:#fff0c8;text-align:left;cursor:pointer}.game:hover{border-color:#ffe296;transform:translateY(-3px)}.art{height:165px;display:grid;place-items:center;background:#0001}.copy{padding:0 16px}.copy h3{margin:0;color:#ffe29a;font:25px Georgia}.copy p{color:#d7c5d8;font-size:12px}.go{position:absolute;right:14px;bottom:13px;display:grid;place-items:center;width:31px;height:31px;border-radius:50%;background:#ffd978;color:#281700}.cards{display:flex;gap:4px}.card{display:grid;place-items:center;width:46px;height:70px;border:2px solid currentColor;border-radius:8px;background:#fff;color:#222;font-weight:bold}.card.r{color:#d95057}.card.y{color:#d4a217}.card.g{color:#24804f}.card.b{color:#287ac1}.dice{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:160px}.die{display:grid;place-items:center;width:43px;height:43px;border-radius:10px;border:2px solid #fff9;box-shadow:2px 4px #0005;font-size:24px}.white{background:#fff;color:#182030}.red{background:#d95057}.yellow{background:#e5b52b;color:#202030}.green{background:#48a76e}.blue{background:#418fd0}@media(max-width:700px){.games{grid-template-columns:1fr}.intro h2{font-size:38px}}
</style><body><header class="top"><div class="brand"><div class="mark">♣</div><div><h1>Judd Game Night <span class="v">v0.2.9</span></h1><p class="sub">Pick a table. Start playing.</p></div></div><span>● Family table open</span></header><main><section class="intro"><h2>What are we playing tonight?</h2><p>Choose a table and jump right in.</p></section><section class="box"><p class="label">Choose a game</p><div class="games" id="games"></div></section></main><script src="games.config.js"></script><script>const art={crowns:'<div class="cards"><b class="card r">7</b><b class="card">Q</b><b class="card g">10</b><b class="card">K</b><b class="card r">J</b></div>',rook:'<div class="cards"><b class="card r">R</b><b class="card y">Y</b><b class="card g">G</b><b class="card b">B</b></div>',qwixx:'<div class="dice"><b class="die white">⚄</b><b class="die white">⚂</b><b class="die red">⚀</b><b class="die yellow">⚀</b><b class="die green">⚄</b><b class="die blue">⚅</b></div>'};for(const game of(window.JUDD_GAMES||[]).filter(x=>x.enabled)){const b=document.createElement('button');b.className='game';b.innerHTML=`<div class="art">${art[game.icon]||''}</div><div class="copy"><h3>${game.title}</h3><p>${game.subtitle}</p></div><i class="go">▶</i>`;b.onclick=()=>{const j=game.path.includes('?')?'&':'?';location.assign(`${game.path}${j}gameNight=${encodeURIComponent(location.href)}`)};document.querySelector('#games').append(b)}</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Judd Game Night</title><style>
:root{--ink:#fff0c8;--muted:#cdb8ce;--gold:#f3c55a;--deep:#100814;--panel:rgba(30,13,36,.91);--line:rgba(243,197,90,.28)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 19% 0%,#4c1e5f 0,transparent 31rem),radial-gradient(circle at 92% 90%,#243d32 0,transparent 32rem),var(--deep)}.topbar{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:11px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);background:rgba(10,5,14,.9)}.brand{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#4c1e5f,#1a0b22);font:31px Georgia;color:var(--gold)}h1{margin:0;color:#ffe29a;font:clamp(22px,3vw,34px)/1 Georgia,serif;letter-spacing:.04em}.version{margin-left:7px;color:var(--muted);font:800 10px Segoe UI}.eyebrow{margin:5px 0 0;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.status{display:flex;align-items:center;gap:8px;color:#bff0d0;font-size:12px;font-weight:800}.dot{width:8px;height:8px;border-radius:50%;background:#65d79d;box-shadow:0 0 12px #65d79d}main{width:min(1000px,100%);margin:auto;padding:clamp(24px,5vw,62px) clamp(16px,4vw,48px) 36px}.intro h2{margin:0;color:#ffe29a;font:clamp(31px,5vw,54px)/1.02 Georgia,serif}.intro p{color:var(--muted);font-size:16px}.game-area{margin-top:28px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.section-label{margin:0 0 13px;color:var(--gold);font:800 11px Inter;letter-spacing:.12em;text-transform:uppercase}.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.game{position:relative;min-height:275px;overflow:hidden;border:1px solid rgba(255,255,255,.15);border-radius:15px;color:var(--ink);background:linear-gradient(145deg,rgba(86,34,102,.8),rgba(35,14,43,.92));text-align:left;cursor:pointer}.game:hover{border-color:#ffe296;transform:translateY(-4px)}.game-art{height:174px;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(243,197,90,.15),transparent 54%)}.game-copy{padding:0 16px 16px}.game h3{margin:0;color:#ffe29a;font:25px Georgia}.game p{margin:6px 0;color:#d7c5d8;font-size:12px;font-weight:700}.play{position:absolute;right:14px;bottom:13px;display:grid;place-items:center;width:31px;height:31px;border:1px solid #ffe296;border-radius:50%;color:#2b1902;background:linear-gradient(#ffd978,#c98c22)}.hand{position:relative;width:205px;height:125px}.card{position:absolute;bottom:2px;width:62px;height:91px;padding:7px;border:2px solid #f5e7c0;border-radius:9px;background:#fffef9;box-shadow:3px 6px 0 rgba(25,8,29,.5);font:900 15px Georgia}.card span{display:block;font-size:20px}.card:nth-child(1){left:5px;transform:rotate(-18deg)}.card:nth-child(2){left:39px;bottom:8px;transform:rotate(-9deg)}.card:nth-child(3){left:72px;bottom:12px}.card:nth-child(4){left:105px;bottom:8px;transform:rotate(9deg)}.card:nth-child(5){left:139px;transform:rotate(18deg)}.five .card:nth-child(1),.five .card:nth-child(4){color:#bd3448}.five .card:nth-child(2),.five .card:nth-child(5){color:#35224c}.five .card:nth-child(3){color:#8854a4}.rook .card{padding:6px 7px;border-color:#f0ebdb}.rook .card:after{content:"";position:absolute;inset:4px;border:2px solid currentColor;border-radius:5px}.rook .card span,.rook .card em{position:relative;z-index:1;display:block;text-align:center}.rook .card span{margin:8px 0 3px;font:900 28px Inter}.rook .card em{font:900 7px Inter}.rook .card:nth-child(1),.rook .card:nth-child(5){color:#c93832}.rook .card:nth-child(2){color:#e2ab19}.rook .card:nth-child(3){color:#24804f}.rook .card:nth-child(4){color:#24282b}.dice{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;width:170px}.die{width:46px;height:46px;display:grid;place-items:center;border:2px solid rgba(255,255,255,.8);border-radius:11px;background:#fff;color:#24152a;box-shadow:2px 4px 0 rgba(0,0,0,.3);font:900 23px Georgia}.die.red{background:#d95057;color:#fff}.die.yellow{background:#e5b52b}.die.green{background:#48a76e;color:#fff}.die.blue{background:#418fd0;color:#fff}@media(max-width:700px){.games{grid-template-columns:1fr}.game{min-height:225px}.game-art{height:133px}}
</style></head><body><header class="topbar"><div class="brand"><div class="mark">♣</div><div><h1>Judd Game Night <span class="version">v0.2.9</span></h1><p class="eyebrow">Pick a table. Start playing.</p></div></div><div class="status"><span class="dot"></span> Family table open</div></header><main><section class="intro"><h2>What are we playing tonight?</h2><p>Choose a table and jump right in.</p></section><section class="game-area"><p class="section-label">Choose a game</p><div class="games" id="games"></div></section></main><script src="games.config.js"></script><script>const hand=(kind,cards)=>`<div class="hand ${kind}">${cards.map(c=>`<div class="card">${c[0]}<span>${c[1]}</span>${c[2]?`<em>${c[2]}</em>`:''}</div>`).join('')}</div>`;const dice=()=>`<div class="dice"><div class="die">⚄</div><div class="die">⚂</div><div class="die red">⚃</div><div class="die yellow">⚁</div><div class="die green">⚄</div><div class="die blue">⚂</div></div>`;const art={crowns:hand('five',[['7','★'],['Q','♥'],['10','♣'],['K','♠'],['J','♦']]),rook:hand('rook',[['R','◆','ROOK'],['Y','◆','ROOK'],['G','◆','ROOK'],['B','◆','ROOK']]),qwixx:dice()};const gamesEl=document.getElementById('games');(window.JUDD_GAMES||[]).filter(g=>g.enabled).forEach(g=>{const b=document.createElement('button');b.className='game';b.innerHTML=`<div class="game-art">${art[g.icon]||''}</div><div class="game-copy"><h3>${g.title}</h3><p>${g.subtitle}</p></div><span class="play">▶</span>`;b.onclick=()=>{const j=g.path.includes('?')?'&':'?';location.assign(`${g.path}${j}gameNight=${encodeURIComponent(location.href)}&gameNightNew=1`)};gamesEl.append(b)})</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Judd Game Night</title>
  <style>
    :root{--ink:#fff0c8;--muted:#cdb8ce;--gold:#f3c55a;--deep:#100814;--panel:rgba(30,13,36,.91);--line:rgba(243,197,90,.28)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 19% 0%,#4c1e5f 0,transparent 31rem),radial-gradient(circle at 92% 90%,#243d32 0,transparent 32rem),var(--deep)}
    .topbar{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:11px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);background:rgba(10,5,14,.9);box-shadow:0 8px 30px rgba(0,0,0,.28)}
    .brand{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#4c1e5f,#1a0b22);font:31px Georgia,serif;color:var(--gold)}
    h1{margin:0;color:#ffe29a;font:clamp(22px,3vw,34px)/1 Georgia,serif;letter-spacing:.04em}.version{margin-left:7px;color:var(--muted);font:800 10px/1 Segoe UI,Arial,sans-serif;letter-spacing:0;vertical-align:top}.eyebrow{margin:5px 0 0;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .status{display:flex;align-items:center;gap:8px;color:#bff0d0;font-size:12px;font-weight:800}.dot{width:8px;height:8px;border-radius:50%;background:#65d79d;box-shadow:0 0 12px #65d79d}
    main{width:min(1000px,100%);margin:auto;padding:clamp(24px,5vw,62px) clamp(16px,4vw,48px) 36px}.intro{max-width:660px}.intro h2{margin:0;color:#ffe29a;font:clamp(31px,5vw,54px)/1.02 Georgia,serif}.intro p{max-width:570px;color:var(--muted);font-size:16px;line-height:1.6}
    .game-area{margin-top:28px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 12px 30px rgba(0,0,0,.25)}.section-label{margin:0 0 13px;color:var(--gold);font:800 11px/1 Inter,Segoe UI,sans-serif;letter-spacing:.12em;text-transform:uppercase}
    .games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.game{position:relative;min-height:275px;overflow:hidden;border:1px solid rgba(255,255,255,.15);border-radius:15px;color:var(--ink);background:linear-gradient(145deg,rgba(86,34,102,.8),rgba(35,14,43,.92));text-align:left;cursor:pointer;transition:transform .16s ease,border-color .16s ease,filter .16s ease}
    .game:hover,.game:focus-visible{border-color:#ffe296;transform:translateY(-4px);filter:brightness(1.12);outline:none}.game-art{height:174px;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(243,197,90,.15),transparent 54%),linear-gradient(135deg,rgba(0,0,0,.12),rgba(255,255,255,.05))}
    .game-copy{padding:0 16px 16px}.game h3{margin:0;color:#ffe29a;font:25px Georgia,serif}.game p{margin:6px 0 0;color:#d7c5d8;font-size:12px;font-weight:700}.play{position:absolute;right:14px;bottom:13px;display:grid;place-items:center;width:31px;height:31px;border:1px solid #ffe296;border-radius:50%;color:#2b1902;background:linear-gradient(#ffd978,#c98c22);font-size:15px}
    .hand{position:relative;width:205px;height:125px}.card{position:absolute;bottom:2px;width:62px;height:91px;padding:7px;border:2px solid #f5e7c0;border-radius:9px;background:linear-gradient(145deg,#fffef9,#e8dfc9);box-shadow:3px 6px 0 rgba(25,8,29,.5),0 9px 16px rgba(0,0,0,.28);font:900 15px Georgia,serif}.card span{display:block;font-size:20px;line-height:1}
    .card:nth-child(1){left:5px;transform:rotate(-18deg);z-index:1}.card:nth-child(2){left:39px;bottom:8px;transform:rotate(-9deg);z-index:2}.card:nth-child(3){left:72px;bottom:12px;z-index:3}.card:nth-child(4){left:105px;bottom:8px;transform:rotate(9deg);z-index:4}.card:nth-child(5){left:139px;transform:rotate(18deg);z-index:5}
    .five .card:nth-child(1),.five .card:nth-child(4){color:#bd3448}.five .card:nth-child(2),.five .card:nth-child(5){color:#35224c}.five .card:nth-child(3){color:#8854a4}.rook .card{background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(239,235,218,.98));border-color:#f0ebdb}.rook .card span{display:grid;place-items:center;width:32px;height:32px;margin:12px auto;border:2px solid currentColor;border-radius:50%;font-size:18px;line-height:1}.rook .card:nth-child(1),.rook .card:nth-child(5){color:#c93832}.rook .card:nth-child(2){color:#e2ab19}.rook .card:nth-child(3){color:#24804f}.rook .card:nth-child(4){color:#24282b}
    .game-frame{position:fixed;z-index:10;inset:0;display:none;flex-direction:column;background:var(--deep)}.game-frame.open{display:flex}.game-frame iframe{width:100%;height:calc(100% - 58px);border:0;background:#100814}.game-nav{display:flex;align-items:center;min-height:58px;padding:9px 16px;border-top:1px solid var(--line);background:rgba(10,5,14,.98)}.back{border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--ink);background:linear-gradient(#442153,#27112f);font-weight:900;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.2)}.back:hover{filter:brightness(1.16)}
    @media(max-width:520px){.topbar{align-items:flex-start}.status{padding-top:7px}.games{grid-template-columns:1fr}.game{min-height:225px}.game-art{height:133px}.hand{transform:scale(.86)}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><div class="mark">♣</div><div><h1>Judd Game Night <span class="version">v0.2.1</span></h1><p class="eyebrow">Pick a table. Start playing.</p></div></div><div class="status"><span class="dot"></span> Family table open</div></header>
  <main><section class="intro"><h2>What are we playing tonight?</h2><p>Choose a table and jump right in.</p></section><section class="game-area"><p class="section-label">Choose a game</p><div class="games" id="games"></div></section></main>
  <section class="game-frame" id="gameFrame"><iframe id="gameView" title="Judd Game Night game"></iframe><nav class="game-nav" aria-label="Game navigation"><button class="back" id="back">← Game Night</button></nav></section>
  <script src="games.config.js"></script>
  <script>
    const games = window.JUDD_GAMES || [];
    const hand = (kind, cards) => `<div class="hand ${kind}">${cards.map(card => `<div class="card">${card[0]}<span>${card[1]}</span></div>`).join("")}</div>`;
    const art = {
      crowns: hand("five", [["7","★"],["Q","♥"],["10","♣"],["K","♠"],["J","♦"]]),
      rook: hand("rook", [["5","●"],["11","◆"],["14","▲"],["10","■"],["1","●"]])
    };
    const gamesEl = document.getElementById("games"), frame = document.getElementById("gameFrame"), view = document.getElementById("gameView");
    games.filter(game => game.enabled).forEach(game => {
      const button = document.createElement("button");
      button.className = "game";
      button.innerHTML = `<div class="game-art">${art[game.icon] || ""}</div><div class="game-copy"><h3>${game.title}</h3><p>${game.subtitle}</p></div><span class="play">▶</span>`;
      button.onclick = () => openGame(game);
      gamesEl.append(button);
    });
    function openGame(game){frame.classList.add("open");view.src=game.path;history.replaceState(null,"",`#${game.id}`)}
    function closeGame(){frame.classList.remove("open");view.src="";history.replaceState(null,"",location.pathname)}
    document.getElementById("back").onclick = closeGame;
  </script>
</body>
</html>

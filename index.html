<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Judd Game Night</title>
  <style>
    :root{--ink:#fff0c8;--muted:#cdb8ce;--gold:#f3c55a;--plum:#32153d;--deep:#100814;--panel:rgba(30,13,36,.91);--line:rgba(243,197,90,.28)}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 19% 0%,#4c1e5f 0,transparent 31rem),radial-gradient(circle at 92% 90%,#243d32 0,transparent 32rem),var(--deep)}
    .topbar{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:11px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);background:rgba(10,5,14,.9);box-shadow:0 8px 30px rgba(0,0,0,.28)}
    .brand{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#4c1e5f,#1a0b22);font:31px Georgia,serif;color:var(--gold)} h1{margin:0;color:#ffe29a;font:clamp(22px,3vw,34px)/1 Georgia,serif;letter-spacing:.04em}.eyebrow{margin:5px 0 0;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.status{display:flex;align-items:center;gap:8px;color:#bff0d0;font-size:12px;font-weight:800}.dot{width:8px;height:8px;border-radius:50%;background:#65d79d;box-shadow:0 0 12px #65d79d}
    main{width:min(1240px,100%);margin:auto;padding:clamp(24px,5vw,62px) clamp(16px,4vw,48px) 36px}.intro{max-width:660px}.intro h2{margin:0;color:#ffe29a;font:clamp(31px,5vw,54px)/1.02 Georgia,serif}.intro p{max-width:570px;color:var(--muted);font-size:16px;line-height:1.6}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;margin-top:28px}.panel{border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 12px 30px rgba(0,0,0,.25)}
    .game-area{padding:18px}.section-label{margin:0 0 13px;color:var(--gold);font:800 11px/1 Inter,Segoe UI,sans-serif;letter-spacing:.12em;text-transform:uppercase}.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.game{position:relative;min-height:275px;overflow:hidden;border:1px solid rgba(255,255,255,.15);border-radius:15px;color:var(--ink);background:linear-gradient(145deg,rgba(86,34,102,.8),rgba(35,14,43,.92));text-align:left;cursor:pointer;transition:transform .16s ease,border-color .16s ease,filter .16s ease}.game:hover,.game:focus-visible{border-color:#ffe296;transform:translateY(-4px);filter:brightness(1.12);outline:none}.game-art{height:174px;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(243,197,90,.15),transparent 54%),linear-gradient(135deg,rgba(0,0,0,.12),rgba(255,255,255,.05))}.game-copy{padding:0 16px 16px}.game h3{margin:0;color:#ffe29a;font:25px Georgia,serif}.game p{margin:6px 0 0;color:#d7c5d8;font-size:12px;font-weight:700}.play{position:absolute;right:14px;bottom:13px;display:grid;place-items:center;width:31px;height:31px;border:1px solid #ffe296;border-radius:50%;color:#2b1902;background:linear-gradient(#ffd978,#c98c22);font-size:15px}
    .crowns{position:relative;width:175px;height:115px;display:flex;align-items:end;justify-content:center;gap:5px}.crown{width:51px;height:69px;border:3px solid #f4d37a;border-radius:7px 7px 14px 14px;background:linear-gradient(135deg,#8d3e99,#441b56);clip-path:polygon(0 100%,0 13%,24% 38%,39% 0,59% 38%,78% 0,100% 38%,100% 100%);box-shadow:0 0 20px rgba(243,197,90,.28)}.crown:nth-child(2){height:95px;transform:translateY(-11px);background:linear-gradient(135deg,#b75a75,#5a2044)}.crown::after{content:'♛';position:absolute;margin:42px 0 0 12px;color:#ffe9a4;font:28px Georgia,serif}.crown:nth-child(2)::after{margin-top:62px}.cards{position:absolute;bottom:-1px;width:54px;height:73px;border:2px solid #f6e8bd;border-radius:8px;background:#fffdf4;box-shadow:3px 5px 0 #2a102f}.cards.one{left:0;transform:rotate(-18deg)}.cards.two{right:0;transform:rotate(18deg)}.cards::after{content:'★';display:grid;place-items:center;height:100%;color:#742d78;font-size:23px}
    .rook-art{position:relative;width:165px;height:130px}.rook-piece{position:absolute;left:50%;bottom:6px;width:90px;height:104px;transform:translateX(-50%);filter:drop-shadow(0 8px 11px rgba(0,0,0,.38))}.rook-piece:before{content:'';position:absolute;left:15px;top:0;width:60px;height:64px;border-radius:4px 4px 26px 26px;background:linear-gradient(90deg,#f8e6a0,#ca8e27 47%,#f8e6a0);clip-path:polygon(0 0,19% 0,19% 11%,37% 11%,37% 0,63% 0,63% 11%,81% 11%,81% 0,100% 0,100% 58%,76% 76%,73% 91%,27% 91%,24% 76%,0 58%)}.rook-piece:after{content:'';position:absolute;bottom:0;width:90px;height:30px;border-radius:50% 50% 8px 8px;background:linear-gradient(#f8e6a0,#bd7b1e)}.rook-suit{position:absolute;z-index:1;left:50%;top:29px;transform:translateX(-50%);color:#4c1e5f;font:31px Georgia,serif}.tricks{position:absolute;left:4px;bottom:16px;color:#d95d69;font:31px Georgia,serif}.tricks.right{left:auto;right:3px;color:#78dfaa}
    .chat{display:grid;grid-template-rows:auto 1fr auto;min-height:390px;padding:15px}.chat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:10px}.chat h2{margin:0;color:#ffe29a;font:21px Georgia,serif}.chat small{color:#bff0d0;font-weight:800}.messages{min-height:205px;max-height:420px;overflow:auto;padding:12px 1px}.message{margin:0 0 11px;font-size:12px;line-height:1.4}.message b{display:block;color:var(--gold);font-size:11px}.empty{color:var(--muted);font-size:12px;font-style:italic}.chat form{display:grid;grid-template-columns:1fr auto;gap:6px}.chat input{min-width:0;padding:10px;border:1px solid rgba(255,255,255,.15);border-radius:9px;color:var(--ink);background:rgba(0,0,0,.22);outline:none}.chat input:focus{border-color:var(--gold)}.send{border:1px solid #ffe296;border-radius:9px;color:#2b1902;background:linear-gradient(#ffd978,#c98c22);font-weight:900;cursor:pointer;padding:0 12px}.name-row{display:flex;gap:7px;align-items:center;margin:0 0 9px;font-size:11px;color:var(--muted)}.name-row input{width:100%;padding:7px}
    .game-frame{position:fixed;z-index:10;inset:0;display:none;background:var(--deep)}.game-frame.open{display:grid;grid-template-columns:minmax(0,1fr) 310px}.game-frame iframe{width:100%;height:100%;border:0;background:#100814}.back{position:fixed;z-index:12;top:12px;left:12px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--ink);background:rgba(16,8,20,.9);font-weight:900;cursor:pointer}.game-frame .chat{border-radius:0;border-width:0 0 0 1px}.missing{display:grid;place-items:center;padding:30px;text-align:center;color:var(--muted)}
    @media(max-width:830px){.layout{grid-template-columns:1fr}.chat{min-height:290px}.game-frame.open{grid-template-columns:1fr}.game-frame .chat{display:none}}@media(max-width:520px){.topbar{align-items:flex-start}.status{padding-top:7px}.games{grid-template-columns:1fr}.game{min-height:225px}.game-art{height:133px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><div class="mark">♣</div><div><h1>Judd Game Night</h1><p class="eyebrow">Pick a table. Keep the conversation going.</p></div></div><div class="status"><span class="dot"></span> Family table open</div></header>
  <main><section class="intro"><h2>What are we playing tonight?</h2><p>Choose a game below. The house chat stays with you, so no one loses the thread between tables.</p></section><div class="layout"><section class="panel game-area"><p class="section-label">Choose a game</p><div class="games" id="games"></div></section><aside class="panel chat" id="sharedChat"></aside></div></main>
  <section class="game-frame" id="gameFrame"><button class="back" id="back">← Game Night</button><iframe id="gameView" title="Judd Game Night game"></iframe><aside class="panel chat" id="inGameChat"></aside></section>
  <script src="games.config.js"></script>
  <script>
    const games = window.JUDD_GAMES || []; let messages = [], lastId = 0;
    const art = { crowns:'<div class="crowns"><div class="cards one"></div><div class="crown"></div><div class="crown"></div><div class="crown"></div><div class="cards two"></div></div>', rook:'<div class="rook-art"><div class="tricks">♥</div><div class="rook-piece"></div><div class="rook-suit">♜</div><div class="tricks right">♠</div></div>' };
    const gamesEl=document.getElementById('games'), frame=document.getElementById('gameFrame'), view=document.getElementById('gameView');
    games.filter(game=>game.enabled).forEach(game=>{const button=document.createElement('button');button.className='game';button.innerHTML=`<div class="game-art">${art[game.icon]||''}</div><div class="game-copy"><h3>${game.title}</h3><p>${game.subtitle}</p></div><span class="play">▶</span>`;button.onclick=()=>openGame(game);gamesEl.append(button)});
    function openGame(game){frame.classList.add('open');view.src=game.path;history.replaceState(null,'',`#${game.id}`)} function closeGame(){frame.classList.remove('open');view.src='';history.replaceState(null,'',location.pathname)} document.getElementById('back').onclick=closeGame;
    function chatMarkup(){return `<div class="chat-head"><h2>Table chat</h2><small>Shared all night</small></div><div class="messages"></div><form><div class="name-row"><span>From</span><input class="name" maxlength="28" placeholder="Your name"></div><input class="text" maxlength="240" autocomplete="off" placeholder="Message everyone..."><button class="send">Send</button></form>`}
    document.getElementById('sharedChat').innerHTML=chatMarkup();document.getElementById('inGameChat').innerHTML=chatMarkup();
    function syncNames(value){document.querySelectorAll('.name').forEach(input=>input.value=value)}function render(){document.querySelectorAll('.messages').forEach(box=>{box.innerHTML=messages.length?messages.map(m=>`<p class="message"><b>${escape(m.name)}</b>${escape(m.text)}</p>`).join(''):'<p class="empty">Say hello — this chat follows every game.</p>';box.scrollTop=box.scrollHeight})}function escape(value){const el=document.createElement('div');el.textContent=value;return el.innerHTML}
    async function load(){try{const response=await fetch('/api/chat');messages=await response.json();const newest=messages.at(-1);if(newest)lastId=newest.id;render()}catch{render()}}async function send(form){const text=form.querySelector('.text').value.trim();if(!text)return;const name=form.querySelector('.name').value.trim()||localStorage.juddName||'Guest';localStorage.juddName=name;syncNames(name);form.querySelector('.text').value='';try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,text})});messages=await response.json();render()}catch{alert('Chat needs the Judd Game Night server running.')} }
    document.querySelectorAll('.chat form').forEach(form=>form.onsubmit=e=>{e.preventDefault();send(form)});document.querySelectorAll('.name').forEach(input=>{input.value=localStorage.juddName||'';input.onchange=()=>syncNames(input.value)});load();setInterval(load,3000);
  </script>
</body></html>

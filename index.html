<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Judd Game Night</title>
  <style>
    :root{--ink:#fff0c8;--muted:#cdb8ce;--gold:#f3c55a;--deep:#100814;--panel:rgba(30,13,36,.91);--line:rgba(243,197,90,.28)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 19% 0%,#4c1e5f 0,transparent 31rem),radial-gradient(circle at 92% 90%,#243d32 0,transparent 32rem),var(--deep)}
    .topbar{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:11px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);background:rgba(10,5,14,.9);box-shadow:0 8px 30px rgba(0,0,0,.28)}
    .brand{display:flex;align-items:center;gap:12px}.mark{width:48px;height:48px;display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#4c1e5f,#1a0b22);font:31px Georgia,serif;color:var(--gold)}
    h1{margin:0;color:#ffe29a;font:clamp(22px,3vw,34px)/1 Georgia,serif;letter-spacing:.04em}.version{margin-left:7px;color:var(--muted);font:800 10px/1 Segoe UI,Arial,sans-serif;letter-spacing:0;vertical-align:top}.eyebrow{margin:5px 0 0;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .status{display:flex;align-items:center;gap:8px;color:#bff0d0;font-size:12px;font-weight:800}.dot{width:8px;height:8px;border-radius:50%;background:#65d79d;box-shadow:0 0 12px #65d79d}
    main{width:min(1000px,100%);margin:auto;padding:clamp(24px,5vw,62px) clamp(16px,4vw,48px) 36px}.intro{max-width:660px}.intro-line{margin:0;color:#ffe29a;font:800 clamp(18px,3vw,25px)/1.2 Georgia,serif;white-space:nowrap}
    .game-area{margin-top:28px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:0 12px 30px rgba(0,0,0,.25)}.section-label{margin:0 0 13px;color:var(--gold);font:800 11px/1 Inter,Segoe UI,sans-serif;letter-spacing:.12em;text-transform:uppercase}
    .games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.game{position:relative;min-height:275px;overflow:hidden;border:1px solid rgba(255,255,255,.15);border-radius:15px;color:var(--ink);background:linear-gradient(145deg,rgba(86,34,102,.8),rgba(35,14,43,.92));text-align:left;cursor:pointer;transition:transform .16s ease,border-color .16s ease,filter .16s ease}
    .game:hover,.game:focus-visible{border-color:#ffe296;transform:translateY(-4px);filter:brightness(1.12);outline:none}.game-art{height:174px;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(243,197,90,.15),transparent 54%),linear-gradient(135deg,rgba(0,0,0,.12),rgba(255,255,255,.05))}
    .game-copy{padding:0 16px 16px}.game h3{margin:0;color:#ffe29a;font:25px Georgia,serif}.game p{margin:6px 0 0;color:#d7c5d8;font-size:12px;font-weight:700}.play{position:absolute;right:14px;bottom:13px;display:grid;place-items:center;width:31px;height:31px;border:1px solid #ffe296;border-radius:50%;color:#2b1902;background:linear-gradient(#ffd978,#c98c22);font-size:15px}
    .hand{position:relative;width:205px;height:125px}.card{position:absolute;bottom:2px;width:62px;height:91px;padding:7px;border:2px solid #f5e7c0;border-radius:9px;background:linear-gradient(145deg,#fffef9,#e8dfc9);box-shadow:3px 6px 0 rgba(25,8,29,.5),0 9px 16px rgba(0,0,0,.28);font:900 15px Georgia,serif}.card span{display:block;font-size:20px;line-height:1}
    .card:nth-child(1){left:5px;transform:rotate(-18deg);z-index:1}.card:nth-child(2){left:39px;bottom:8px;transform:rotate(-9deg);z-index:2}.card:nth-child(3){left:72px;bottom:12px;z-index:3}.card:nth-child(4){left:105px;bottom:8px;transform:rotate(9deg);z-index:4}.card:nth-child(5){left:139px;transform:rotate(18deg);z-index:5}
    .five .card:nth-child(1),.five .card:nth-child(4){color:#bd3448}.five .card:nth-child(2),.five .card:nth-child(5){color:#35224c}.five .card:nth-child(3){color:#8854a4}.game-art .rook-fan{position:relative;width:176px;height:112px}.game-art .rook-fan b{position:absolute;bottom:3px;width:53px;height:82px;padding:6px;border:3px solid currentColor;border-radius:8px;background:linear-gradient(145deg,#fffef9,#e8dfc9);box-shadow:3px 5px 0 #0005;color:#25282b;font:900 12px Georgia}.game-art .rook-fan b::after{content:"";position:absolute;inset:4px;border:1px solid currentColor;border-radius:4px;opacity:.65}.game-art .rook-fan span{position:relative;z-index:1}.game-art .rook-fan .r{left:13px;color:#c93832;transform:rotate(-12deg)}.game-art .rook-fan .k{left:42px;color:#24282b;transform:rotate(-6deg)}.game-art .rook-fan .y{left:72px;color:#d9a71e;transform:rotate(-1deg)}.game-art .rook-fan .g{left:102px;color:#24804f;transform:rotate(5deg)}.game-art .rook-fan .last{left:126px;color:#24282b;transform:rotate(10deg);font-size:12px}.game-art .solitaire-fan .r{left:29px;bottom:6px;transform:rotate(-9deg)}.game-art .solitaire-fan .last{left:91px;bottom:6px;transform:rotate(9deg);font-size:12px}.game-art .qwixx-art{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:168px}.game-art .qwixx-die{display:grid;grid-template:repeat(3,7px)/repeat(3,7px);gap:5px;place-content:center;width:42px;height:42px;border:2px solid #fff9;border-radius:10px;box-shadow:2px 4px 0 #0004}.game-art .qwixx-die:nth-child(1){transform:rotate(-8deg) translate(-3px,4px)}.game-art .qwixx-die:nth-child(2){transform:rotate(7deg) translate(3px,-4px)}.game-art .qwixx-die:nth-child(3){transform:rotate(10deg) translate(3px,3px)}.game-art .qwixx-die:nth-child(4){transform:rotate(-6deg) translate(-3px,-3px)}.game-art .qwixx-die:nth-child(5){transform:rotate(5deg) translate(3px,4px)}.game-art .qwixx-die:nth-child(6){transform:rotate(-11deg) translate(-3px,-2px)}.game-art .qwixx-die i{width:7px;height:7px;border-radius:50%;background:currentColor}.game-art .qwixx-die.white{background:#faf7ed;color:#1e2230}.game-art .qwixx-die.red{background:#d95057;color:#fff}.game-art .qwixx-die.yellow{background:#efd52f;color:#20202a}.game-art .qwixx-die.green{background:#1bae74;color:#fff}.game-art .qwixx-die.blue{background:#277dcc;color:#fff}
    @media (min-width:521px) and (max-width:1024px), (min-width:521px) and (max-height:800px){.topbar{min-height:60px;padding:7px clamp(16px,3vw,30px)}.mark{width:40px;height:40px;font-size:26px}h1{font-size:26px}.eyebrow{margin-top:3px}.status{font-size:11px}main{padding:14px clamp(16px,3vw,30px) 18px}.game-area{margin-top:12px;padding:14px}.section-label{margin-bottom:10px}.game{min-height:220px}.game-art{height:139px}.game h3{font-size:20px}.game p{font-size:11px}.hand{transform:scale(.8)}.rook-fan{transform:scale(.8)}.qwixx-art{transform:scale(.8)}}
    @media(max-width:520px){.topbar{align-items:flex-start}.status{padding-top:7px}.games{grid-template-columns:1fr}.game{min-height:225px}.game-art{height:133px}.hand{transform:scale(.86)}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><div class="mark">♣</div><div><h1>Judd Game Night <span class="version">v0.2.12</span></h1><p class="eyebrow">Pick a table. Start playing.</p></div></div><div class="status"><span class="dot"></span> Family table open</div></header>
  <main><section class="intro"><p class="intro-line">What are we playing tonight?</p></section><section class="game-area"><p class="section-label">Choose a game</p><div class="games" id="games"></div></section></main>
  <script src="games.config.js"></script>
  <script>
    const games = window.JUDD_GAMES || [];
    const hand = (kind, cards) => `<div class="hand ${kind}">${cards.map(card => `<div class="card">${card[0]}<span>${card[1]}</span>${card[2] ? `<em>${card[2]}</em>` : ""}</div>`).join("")}</div>`;
    const qwixxDie = (number, color) => {
      const spots = {1:[[2,2]],2:[[1,1],[3,3]],3:[[1,1],[2,2],[3,3]],4:[[1,1],[1,3],[3,1],[3,3]],5:[[1,1],[1,3],[2,2],[3,1],[3,3]],6:[[1,1],[2,1],[3,1],[1,3],[2,3],[3,3]]}[number];
      return `<b class="qwixx-die ${color}">${spots.map(([row,column]) => `<i style="grid-area:${row}/${column}"></i>`).join("")}</b>`;
    };
    const art = {
      crowns: hand("five", [["7","★"],["Q","♥"],["10","♣"],["K","♠"],["J","♦"]]),
      rook: '<div class="rook-fan"><b class="r"><span>12</span></b><b class="k"><span>R</span></b><b class="y"><span>1</span></b><b class="g"><span>14</span></b><b class="last"><span>10</span></b></div>',
      qwixx: `<div class="qwixx-art">${qwixxDie(3,"white")}${qwixxDie(4,"white")}${qwixxDie(1,"red")}${qwixxDie(2,"yellow")}${qwixxDie(5,"green")}${qwixxDie(6,"blue")}</div>`,
      solitaire: '<div class="rook-fan solitaire-fan"><b class="r"><span>R</span></b><b class="last"><span>1</span></b></div>'
    };
    const gamesEl = document.getElementById("games");
    games.filter(game => game.enabled).forEach(game => {
      const button = document.createElement("button");
      button.className = "game";
      button.innerHTML = `<div class="game-art">${art[game.icon] || ""}</div><div class="game-copy"><h3>${game.title}</h3><p>${game.subtitle}</p></div><span class="play">▶</span>`;
      button.onclick = () => openGame(game);
      gamesEl.append(button);
    });
    function openGame(game){const joiner=game.path.includes("?")?"&":"?";window.location.assign(`${game.path}${joiner}gameNight=${encodeURIComponent(location.href)}&gameNightNew=1`)}
  </script>
</body>
</html>
